name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android action (it failed in run 39935393625 before any project
      # code ran) and no bare `sdkmanager` either: it is not on PATH in the run
      # shell (run 39942916036, step failed in <1s). Call it by full path under
      # ANDROID_HOME, which the runner image always sets.
      - name: Install SDK Platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests (pure JVM modules)
        run: ./gradlew :player-api:test :subtitle-core:test :playback-storage:test --stacktrace

      - name: Unit tests (tv-input, Android library)
        run: ./gradlew :tv-input:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug --stacktrace

      - name: Lint (report only)
        run: ./gradlew :app-android:lintDebug --stacktrace || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universalplayer-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app-android/build/reports/lint-results-debug.*
          if-no-files-found: ignore
