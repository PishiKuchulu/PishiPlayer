name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android action: the ubuntu-latest runner image already ships an
      # Android SDK (ANDROID_HOME) with sdkmanager on PATH. The action step failed
      # in run 39935393625 (6s, before any project code ran); using the
      # preinstalled SDK removes that failure point.
      - name: Install SDK Platform 35
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests (pure JVM modules)
        run: ./gradlew :player-api:test :subtitle-core:test :playback-storage:test --stacktrace

      - name: Unit tests (tv-input, Android library)
        run: ./gradlew :tv-input:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug --stacktrace

      - name: Lint (report only)
        run: ./gradlew :app-android:lintDebug --stacktrace || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universalplayer-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app-android/build/reports/lint-results-debug.*
          if-no-files-found: ignore
